<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluxo de Caixa</title><style>
:root{--ink:#0e1736;--blue:#155eef;--sky:#eaf1ff;--green:#16a34a;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#f4f7ff,#eefbf5);color:var(--ink)}main{max-width:1100px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;gap:13px;align-items:center}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--blue);color:#fff;font-size:22px;box-shadow:0 12px 25px #155eef44}h1{font-size:24px;margin:0}.sub{margin:4px 0 0;color:var(--muted);font-size:14px}.date{background:#fff;border:1px solid #dbe5ff;padding:10px 14px;border-radius:12px;font-weight:700}.hero{background:linear-gradient(115deg,#155eef,#3b82f6);color:white;border-radius:24px;padding:30px;box-shadow:0 18px 38px #155eef30}.hero p{margin:0;opacity:.82}.balance{font-size:42px;font-weight:800;margin:10px 0 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card,.table{background:#fff;border:1px solid #e7ecf8;border-radius:18px;box-shadow:0 8px 22px #0e173608}.card{padding:20px}.label{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.money{font-size:26px;font-weight:800;margin-top:8px}.positive{color:var(--green)}.table{padding:8px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:640px}th{text-align:left;color:#51607c;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:14px}td{padding:16px 14px;border-top:1px solid #edf0f6;font-size:14px}.badge{background:#eaf1ff;color:#155eef;padding:6px 10px;border-radius:999px;font-weight:700;font-size:12px}.empty{text-align:center;color:var(--muted);padding:24px}.add{margin-top:20px;background:#0e1736;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:750;cursor:pointer}.add:hover{background:#155eef}@media(max-width:700px){header{align-items:flex-start;gap:14px;flex-direction:column}.cards{grid-template-columns:1fr}.balance{font-size:34px}}</style></head>
<body><main><header><div class="brand"><div class="mark">R$</div><div><h1>Fluxo de Caixa</h1><p class="sub">Visão rápida das entradas e do saldo</p></div></div><div class="date">Atualizado hoje</div></header><section class="hero"><p>SALDO DISPONÍVEL</p><div class="balance" id="balance">R$ 160,00</div></section><section class="cards"><div class="card"><div class="label">Pix</div><div class="money positive" id="pix">R$ 0,00</div></div><div class="card"><div class="label">Cartão</div><div class="money positive" id="card">R$ 0,00</div></div><div class="card"><div class="label">Dinheiro no balcão</div><div class="money positive" id="cash">R$ 0,00</div></div></section><section class="table"><table><thead><tr><th>Data</th><th>Descrição</th><th>Forma de entrada</th><th>Valor</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Nenhuma entrada registrada ainda.</td></tr></tbody></table></section><button class="add" onclick="addEntry()">+ Adicionar entrada</button></main><script>const fmt=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});let total=160;let values={Pix:0,"Cartão":0,"Dinheiro no balcão":0};function addEntry(){const desc=prompt("Descrição da entrada:");if(!desc)return;const method=prompt("Forma: Pix, Cartão ou Dinheiro no balcão","Pix");if(!values.hasOwnProperty(method))return alert("Escolha Pix, Cartão ou Dinheiro no balcão.");const amount=Number(prompt("Valor da entrada:"));if(!amount||amount<0)return;values[method]+=amount;total+=amount;document.getElementById("balance").textContent=fmt(total);document.getElementById(method==="Pix"?"pix":method==="Cartão"?"card":"cash").textContent=fmt(values[method]);const rows=document.getElementById("rows");if(rows.querySelector(".empty"))rows.innerHTML="";rows.insertAdjacentHTML("beforeend","<tr><td>"+new Date().toLocaleDateString("pt-BR")+"</td><td>"+desc+"</td><td><span class="badge">"+method+"</span></td><td>"+fmt(amount)+"</td></tr>")}</script></body></html>
