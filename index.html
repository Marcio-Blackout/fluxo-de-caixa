<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Fluxo de Caixa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0a0e1a, #1a1f2e, #0f1419); color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 22px; font-weight: 700; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 8px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
        .status.offline .status-dot { background: #ef4444; animation: none; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .hero { background: linear-gradient(135deg, #4f46e5, #7c3aed, #a855f7); border-radius: 22px; padding: 30px 26px; margin-bottom: 20px; box-shadow: 0 20px 50px rgba(79,70,229,0.3); position: relative; overflow: hidden; }
        .hero::before { content:''; position:absolute; top:-50%; right:-20%; width:200px; height:200px; background:rgba(255,255,255,0.05); border-radius:50%; }
        .hero-label { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:1.5px; opacity:0.85; position:relative; z-index:1; }
        .balance { font-size:44px; font-weight:800; margin-top:8px; position:relative; z-index:1; }
        .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
        .card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:18px; }
        .card-label { font-size:11px; color:#9ca3af; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
        .card-value { font-size:22px; font-weight:700; }
        .card:nth-child(1) .card-value{color:#10b981} .card:nth-child(2) .card-value{color:#60a5fa} .card:nth-child(3) .card-value{color:#f59e0b}
        .table-container { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:16px; overflow:hidden; margin-bottom:20px; }
        .table-header { padding:14px 18px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; }
        .table-header h3 { font-size:15px; }
        .table-count { font-size:11px; color:#9ca3af; background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:20px; }
        .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
        table { width:100%; border-collapse:collapse; min-width:500px; }
        th { text-align:left; padding:12px 18px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6b7280; border-bottom:1px solid rgba(255,255,255,0.08); }
        td { padding:14px 18px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; }
        .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-pix{background:rgba(16,185,129,0.15);color:#10b981} .badge-card{background:rgba(96,165,250,0.15);color:#60a5fa} .badge-cash{background:rgba(245,158,11,0.15);color:#f59e0b}
        .amount{font-weight:700;color:#10b981}
        .actions { display:flex; gap:12px; flex-wrap:wrap; }
        .btn-primary { flex:2; padding:15px; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; color:white; background:linear-gradient(135deg,#4f46e5,#7c3aed); box-shadow:0 4px 15px rgba(79,70,229,0.4); min-width:180px; }
        .btn-primary:active{transform:scale(0.98)}
        .btn-secondary { flex:1; padding:15px; border:1px solid rgba(255,255,255,0.1); border-radius:14px; font-size:15px; font-weight:600; cursor:pointer; color:#cbd5e1; background:rgba(255,255,255,0.05); min-width:100px; }
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); z-index:1000; align-items:flex-end; justify-content:center; padding:16px; }
        .modal.active{display:flex}
        .modal-content { background:linear-gradient(135deg,#1a1f2e,#0f1419); border:1px solid rgba(255,255,255,0.1); border-radius:20px 20px 0 0; padding:26px 22px; width:100%; max-width:450px; animation:slideUp 0.3s ease-out; }
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal h2{font-size:19px;margin-bottom:18px}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
        .form-group input,.form-group select{width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#e2e8f0;font-size:15px;font-family:inherit}
        .form-group select{appearance:none}
        .modal-buttons{display:flex;gap:10px;margin-top:22px}
        .btn-cancel{flex:1;padding:13px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:white;border-radius:12px;font-size:14px;cursor:pointer}
        .btn-save{flex:2;padding:13px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;color:white;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
        .empty-state{text-align:center;padding:36px;color:#6b7280}
        .empty-icon{font-size:36px;margin-bottom:10px;opacity:0.5}
        @media(max-width:600px){.cards{grid-template-columns:1fr}.balance{font-size:34px}.hero{padding:22px 18px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Fluxo de Caixa</h1>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span id="statusText">Conectando...</span>
            </div>
        </div>

        <div class="hero">
            <div class="hero-label">💎 Saldo Disponível</div>
            <div class="balance" id="balance">R$ 0,00</div>
        </div>

        <div class="cards">
            <div class="card"><div class="card-label">📱 Pix</div><div class="card-value" id="pix">R$ 0,00</div></div>
            <div class="card"><div class="card-label">💳 Cartão</div><div class="card-value" id="card">R$ 0,00</div></div>
            <div class="card"><div class="card-label">💵 Dinheiro</div><div class="card-value" id="cash">R$ 0,00</div></div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>📋 Histórico de Entradas</h3>
                <span class="table-count" id="entryCount">0 registros</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>📅 Data</th><th>📝 Descrição</th><th>💳 Forma</th><th>💰 Valor</th></tr></thead>
                    <tbody id="rows"><tr><td colspan="4"><div class="empty-state"><div class="empty-icon">📭</div><div>Carregando...</div></div></td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="openModal()">＋ Nova Entrada</button>
            <button class="btn-secondary" onclick="loadData()">🔄 Atualizar</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>✨ Registrar Entrada</h2>
            <form onsubmit="saveEntry(event)">
                <div class="form-group"><label>📝 Descrição</label><input type="text" id="desc" required placeholder="Ex: Venda de produto"></div>
                <div class="form-group"><label>💳 Forma de Pagamento</label><select id="method" required><option value="Pix">📱 Pix</option><option value="Cartão">💳 Cartão</option><option value="Dinheiro no balcão">💵 Dinheiro</option></select></div>
                <div class="form-group"><label>💰 Valor (R$)</label><input type="number" id="amount" required placeholder="0,00" step="0.01" min="0.01" inputmode="decimal"></div>
                <div class="modal-buttons"><button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-save">💾 Salvar</button></div>
            </form>
        </div>
    </div>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbw1j-zecIfbUU2ckevX7OoTvunevTabD3_fZrYPhVo6kgyg2E0I-V6ymfEoLchVMDOD/exec';
        const fmt = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
        
        function updateStatus(o){const s=document.getElementById('status'),t=document.getElementById('statusText');s.className='status'+(o?'':' offline');t.textContent=o?'✅ Conectado':'❌ Offline'}
        
        async function loadData(){updateStatus(false);try{const r=await fetch(URL+'?action=getData'),d=await r.json();if(d.error)throw new Error(d.error);const t=d.totals||{};document.getElementById('balance').textContent=fmt(t.geral);document.getElementById('pix').textContent=fmt(t.pix);document.getElementById('card').textContent=fmt(t.cartao);document.getElementById('cash').textContent=fmt(t.dinheiro);const e=d.entries||[];document.getElementById('entryCount').textContent=e.length+' registro'+(e.length!==1?'s':'');const rows=document.getElementById('rows');e.length===0?rows.innerHTML='<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">📭</div><div>Nenhuma entrada ainda</div></div></td></tr>':rows.innerHTML=e.map(e=>{const b='badge-'+(e.method==='Pix'?'pix':e.method==='Cartão'?'card':'cash');return`<tr><td>${e.date||'-'}</td><td>${e.desc||'-'}</td><td><span class="badge ${b}">${e.method||'-'}</span></td><td class="amount">${fmt(e.amount)}</td></tr>`}).join('');updateStatus(true)}catch(e){console.error(e);updateStatus(false);document.getElementById('rows').innerHTML=`<tr><td colspan="4"><div class="empty-state" style="color:#ef4444;">⚠️ ${e.message}</div></td></tr>`}}
        
        async function saveEntry(e){e.preventDefault();const btn=document.querySelector('.btn-save');btn.textContent='Salvando...';btn.disabled=true;try{const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'addEntry',desc:document.getElementById('desc').value.trim(),method:document.getElementById('method').value,amount:parseFloat(document.getElementById('amount').value)})}),d=await r.json();if(d.success){closeModal();await loadData();alert('✅ Entrada adicionada!')}else throw new Error(d.error||'Erro')}catch(e){alert('Erro: '+e.message)}finally{btn.textContent='💾 Salvar';btn.disabled=false}}
        
        function openModal(){document.getElementById('modal').classList.add('active');document.getElementById('desc').focus()}
        function closeModal(){document.getElementById('modal').classList.remove('active');document.querySelector('form').reset()}
        
        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
        document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
        
        loadData();
        setInterval(loadData,30000);
    </script>
</body>
</html>
